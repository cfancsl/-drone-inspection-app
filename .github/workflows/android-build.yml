# GitHub Actions - Android APK 自动构建
name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 设置 Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # 3. 设置 Java (JDK 21)
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 4. 安装依赖
      - name: Install dependencies
        run: |
          npm ci
          echo "Dependencies installed"

      # 5. 构建 Web 应用
      - name: Build Web App
        run: |
          npm run build
          echo "Web build completed"

      # 6. 同步到 Android 项目
      - name: Sync Capacitor Android
        run: |
          npx cap sync android
          echo "Android sync completed"

      # 7. 设置 Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 8. 构建 APK (使用 Gradle Wrapper)
      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          echo "APK build completed"

      # 9. 上传 APK 产物
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # 10. 构建完成总结
      - name: Build Summary
        run: |
          echo "## ✅ 构建完成!"
          echo ""
          echo "**APK 下载方式:**"
          echo "1. 点击本页面 Artifacts 区域"
          echo "2. 下载 app-debug.zip"
          echo "3. 解压得到 app-debug.apk"
          echo ""
          echo "**安装说明:**"
          echo "1. 下载 app-debug.apk"
          echo "2. 传输到 Android 手机"
          echo "3. 允许安装未知来源应用"
          echo "4. 点击安装"
