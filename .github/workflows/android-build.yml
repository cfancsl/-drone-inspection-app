# GitHub Actions - Android APK 自动构建
name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 设置 Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # 3. 设置 Java (JDK 17)
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 4. 安装依赖
      - name: Install dependencies
        run: |
          npm ci
          echo "Dependencies installed"

      # 5. 构建 Web 应用
      - name: Build Web App
        run: |
          npm run build
          echo "Web build completed"

      # 6. 同步到 Android 项目
      - name: Sync Capacitor Android
        run: |
          npx cap sync android
          echo "Android sync completed"

      # 7. 设置 Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 8. 构建 APK (使用 Gradle Wrapper)
      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          echo "APK build completed"

      # 9. 上传 APK 产物
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # 10. 创建 Release (仅当推送到 main/master 时)
      - name: Create Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          tag_name: v${{ github.run_number }}
          name: Build ${{ github.run_number }} - ${{ github.sha }}
          body: |
            ## 📱 无人机巡检 APP 自动构建
            
            **构建信息:**
            - 提交：${{ github.sha }}
            - 时间：${{ github.event.head_commit.timestamp }}
            - 触发者：${{ github.actor }}
            
            **下载:**
            - [app-debug.apk](https://github.com/${{ github.repository }}/releases/download/v${{ github.run_number }}/app-debug.apk)
            
            ---
            🤖 由 GitHub Actions 自动构建
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 11. 构建完成通知
      - name: Build Summary
        run: |
          echo "## ✅ 构建完成!"
          echo ""
          echo "**APK 位置:**"
          echo "- 构建产物：查看本页面 Artifacts 区域"
          echo "- Release 下载：https://github.com/${{ github.repository }}/releases"
          echo ""
          echo "**安装说明:**"
          echo "1. 下载 app-debug.apk"
          echo "2. 传输到 Android 手机"
          echo "3. 允许安装未知来源应用"
          echo "4. 点击安装"
